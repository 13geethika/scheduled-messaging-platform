version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: chronos-db
    restart: always
    environment:
      MYSQL_DATABASE: scheduled_messaging
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - chronos-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    container_name: chronos-mail
    restart: always
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI port
    networks:
      - chronos-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chronos-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/scheduled_messaging?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_MAIL_HOST=mailpit
      - SPRING_MAIL_PORT=1025
      - APP_SERVER_URL=http://localhost:8080
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - chronos-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chronos-frontend
    restart: always
    ports:
      - "5173:80" # Map container port 80 to host 5173 to align with backend CORS origin
    depends_on:
      - backend
    networks:
      - chronos-network

volumes:
  mysql_data:

networks:
  chronos-network:
    driver: bridge
